<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OutDaHoodv1 Weapons Tier Spin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>OutDaHoodv1 Weapons Tier Spin</h1>
      <p>WindyCityV5 / OutDaHoodv1 Tier System</p>
    </header>

    <!-- TIER SELECT WITH ICONS -->
    <section class="tier-section">
      <h2>Select Tier</h2>
      <div class="tier-grid">
        <div class="tier-card" data-tier="T1">
          <img src="icons/t1.png" alt="T1" />
          <span>Tier 1</span>
        </div>

        <div class="tier-card" data-tier="T1.5">
          <img src="icons/t1_5.png" alt="T1.5" />
          <span>Tier 1.5</span>
        </div>

        <div class="tier-card" data-tier="T2">
          <img src="icons/t2.png" alt="T2" />
          <span>Tier 2</span>
        </div>

        <div class="tier-card" data-tier="T3">
          <img src="icons/t3.png" alt="T3" />
          <span>Tier 3</span>
        </div>

        <div class="tier-card" data-tier="T4">
          <img src="icons/t4.png" alt="T4" />
          <span>Tier 4</span>
        </div>
      </div>

      <button id="spinWeapon" class="spin-btn">Spin Weapon</button>
      <div id="weaponResult" class="result-card"></div>
    </section>

    <!-- DRUG RANDOMIZER -->
    <section class="drug-section">
      <h2>Drug Randomizer</h2>
      <div class="tier-grid">
        <div class="drug-card" data-tier="T1">Tier 1</div>
        <div class="drug-card" data-tier="T1.5">Tier 1.5</div>
        <div class="drug-card" data-tier="T2">Tier 2</div>
        <div class="drug-card" data-tier="T3">Tier 3</div>
        <div class="drug-card" data-tier="T4">Tier 4</div>
      </div>

      <button id="spinDrugs" class="spin-btn">Spin Drugs</button>
      <div id="drugResult" class="result-card"></div>
    </section>

    <!-- FACTION DROP -->
    <section class="faction-section">
      <h2>Faction Drop Simulator</h2>
      <select id="faction">
        <option value="hood">Hood Gang</option>
        <option value="cartel">Cartel</option>
        <option value="police">Police</option>
        <option value="custom">Custom Faction</option>
      </select>

      <button id="spinFaction" class="spin-btn">Simulate Drop</button>
      <div id="factionResult" class="result-card"></div>
    </section>

    <footer>
      <p>OutDaHoodv1 / WindyCityV5 Tools</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
