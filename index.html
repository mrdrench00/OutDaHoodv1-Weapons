<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OutDaHoodv1 Weapons Spin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="tier-section">
    <h2>Select Tier</h2>

    <div class="tier-grid">
      <div class="tier-card" data-tier="T1">
        <img src="icons/t1.png" alt="T1">
        <span>Tier 1</span>
      </div>

      <div class="tier-card" data-tier="T1.5">
        <img src="icons/t1_5.png" alt="T1.5">
        <span>Tier 1.5</span>
      </div>

      <div class="tier-card" data-tier="T2">
        <img src="icons/t2.png" alt="T2">
        <span>Tier 2</span>
      </div>

      <div class="tier-card" data-tier="T3">
        <img src="icons/t3.png" alt="T3">
        <span>Tier 3</span>
      </div>

      <div class="tier-card" data-tier="T4">
        <img src="icons/t4.png" alt="T4">
        <span>Tier 4</span>
      </div>
    </div>

    <button id="spinWeapon" class="spin-btn">Spin Weapon</button>

    <div id="weaponResults" class="weapon-results"></div>
      <img id="weaponImage" src="" alt="Weapon Image">
      <h3 id="weaponName"></h3>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
